# CI Workflow – Development Environment
# Trigger: Pull Request targeting the develop branch
# Responsibility: Team Lead (Member 1)

name: CI – Development

on:
  pull_request:
    branches:
      - develop

jobs:
  ci-dev:
    name: Build & Push Docker Image (dev)
    runs-on: ubuntu-latest

    steps:
      # Step 1 – Checkout
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2 – Lint & Build
      - name: Install Node & Linting tools
        run: |
          npm install -g htmlhint stylelint stylelint-config-standard

      - name: Lint HTML
        run: htmlhint "*.html"

      - name: Create stylelint config
        run: echo '{"extends":["stylelint-config-standard"],"rules":{"color-hex-length":null,"value-keyword-case":null,"color-function-alias-notation":null,"color-function-notation":null,"alpha-value-notation":null,"no-descending-specificity":null,"media-feature-range-notation":null}}' > .stylelintrc.json

      - name: Lint CSS
        run: stylelint "*.css"

      # Step 3 – Docker Login
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Step 4 & 5 & 6 – Build, Tag, Push
      - name: Build and push Docker image (dev)
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/pakvista-cicd:dev-latest
            ${{ secrets.DOCKERHUB_USERNAME }}/pakvista-cicd:dev-${{ github.sha }}
