# CI Workflow – Production Environment
# Trigger: Pull Request targeting the main branch
# Responsibility: Member 5

name: CI – Production

on:
  pull_request:
    branches:
      - main

jobs:
  ci-prod:
    name: Build & Push Docker Image (prod)
    runs-on: ubuntu-latest

    steps:
      # Step 1 – Checkout
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2 – Lint & Build
      - name: Install Node & Linting tools
        run: |
          npm install -g htmlhint stylelint stylelint-config-standard

      - name: Lint HTML
        run: htmlhint "*.html"

      - name: Create stylelint config
        run: echo '{"extends":["stylelint-config-standard"]}' > .stylelintrc.json

      - name: Lint CSS
        run: stylelint "*.css"

      # Step 3 – Docker Login
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Step 4 & 5 & 6 – Build, Tag, Push
      - name: Build and push Docker image (prod)
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/pakvista-cicd:prod-latest
            ${{ secrets.DOCKERHUB_USERNAME }}/pakvista-cicd:prod-${{ github.sha }}
